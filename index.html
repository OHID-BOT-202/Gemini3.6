<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ohid AI</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --cyan:#00ffff;
  --pink:#ff00cc;
  --purple:#8b00ff;
  --blue:#0066ff;
  --bg:#050509;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
  font-family:Arial,sans-serif;
  color:white;
  background:#050509;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:-50%;
  z-index:-3;
  background:
    radial-gradient(circle at 20% 20%,#ff00cc55,transparent 30%),
    radial-gradient(circle at 80% 30%,#00ffff55,transparent 30%),
    radial-gradient(circle at 50% 90%,#8b00ff55,transparent 30%);
  animation:bgMove 12s ease-in-out infinite alternate;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    linear-gradient(90deg,transparent 49%,#ffffff08 50%,transparent 51%),
    linear-gradient(transparent 49%,#ffffff08 50%,transparent 51%);
  background-size:45px 45px;
  animation:gridMove 8s linear infinite;
  pointer-events:none;
}

@keyframes bgMove{
  from{
    transform:translate(-5%,-5%) rotate(0deg) scale(1);
  }
  to{
    transform:translate(5%,5%) rotate(12deg) scale(1.2);
  }
}

@keyframes gridMove{
  from{transform:translate(0,0)}
  to{transform:translate(45px,45px)}
}

.app{
  width:100%;
  max-width:900px;
  padding:2px;
  border-radius:25px;
  background:linear-gradient(
    90deg,
    var(--cyan),
    var(--pink),
    var(--purple),
    var(--blue),
    var(--cyan)
  );
  background-size:400% 400%;
  animation:rgbBorder 8s linear infinite;
  box-shadow:
    0 0 18px #00ffff66,
    0 0 40px #ff00cc44;
}

@keyframes rgbBorder{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.inner{
  min-height:650px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border-radius:23px;
  background:rgba(8,8,18,.9);
  backdrop-filter:blur(18px);
}

.header{
  position:relative;
  padding:24px 15px;
  text-align:center;
  border-bottom:1px solid #ffffff18;
  overflow:hidden;
}

.header::after{
  content:"";
  position:absolute;
  bottom:0;
  left:-100%;
  width:100%;
  height:2px;
  background:linear-gradient(
    90deg,
    transparent,
    var(--cyan),
    var(--pink),
    transparent
  );
  animation:headerLine 4s linear infinite;
}

@keyframes headerLine{
  from{left:-100%}
  to{left:100%}
}

.logo{
  width:75px;
  height:75px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 12px;
  border:2px solid var(--cyan);
  border-radius:50%;
  color:var(--cyan);
  font-size:32px;
  font-weight:bold;
  text-shadow:0 0 15px var(--cyan);
  box-shadow:
    0 0 15px var(--cyan),
    inset 0 0 18px #00ffff66;
  animation:logoPulse 2.5s ease-in-out infinite;
}

@keyframes logoPulse{
  0%,100%{
    transform:scale(1);
  }
  50%{
    transform:scale(1.08);
    box-shadow:
      0 0 30px var(--cyan),
      0 0 50px #ff00cc66;
  }
}

.title{
  margin:0;
  font-size:clamp(28px,7vw,45px);
  letter-spacing:3px;
  font-weight:900;
  background:linear-gradient(
    90deg,
    var(--cyan),
    var(--pink),
    var(--purple),
    var(--cyan)
  );
  background-size:300% auto;
  color:transparent;
  -webkit-background-clip:text;
  background-clip:text;
  animation:titleRGB 5s linear infinite;
}

@keyframes titleRGB{
  to{background-position:300% center}
}

.subtitle{
  margin:10px 0;
  color:#aaaabd;
  font-size:13px;
  letter-spacing:1px;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:7px 13px;
  border:1px solid #00ffcc66;
  border-radius:30px;
  color:#00ffcc;
  background:#00ffcc0d;
  font-size:12px;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#00ffcc;
  box-shadow:0 0 10px #00ffcc;
  animation:blink 1.2s infinite;
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:.3}
}

.chat{
  flex:1;
  min-height:350px;
  max-height:470px;
  overflow-y:auto;
  padding:20px;
  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
  width:6px;
}

.chat::-webkit-scrollbar-thumb{
  border-radius:20px;
  background:linear-gradient(var(--cyan),var(--pink));
}

.welcome{
  padding:35px 15px;
  text-align:center;
  color:#bdbdcc;
  animation:welcomeShow .7s ease both;
}

.welcome-icon{
  font-size:45px;
  margin-bottom:15px;
  animation:floatIcon 3s ease-in-out infinite;
}

.welcome h2{
  margin:0 0 10px;
  font-size:22px;
}

.welcome p{
  margin:0;
  font-size:13px;
  line-height:1.7;
}

@keyframes welcomeShow{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes floatIcon{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.message{
  display:flex;
  margin:15px 0;
  animation:messageShow .35s ease both;
}

.message.user{
  justify-content:flex-end;
}

.message.ai{
  justify-content:flex-start;
}

.bubble{
  max-width:82%;
  padding:13px 16px;
  border-radius:17px;
  font-size:14px;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .bubble{
  border:1px solid #00ffff99;
  border-bottom-right-radius:4px;
  background:linear-gradient(135deg,#0066ff55,#00ffff22);
  box-shadow:0 0 15px #00ffff22;
}

.ai .bubble{
  border:1px solid #ff00cc88;
  border-bottom-left-radius:4px;
  background:linear-gradient(135deg,#ff00cc22,#8b00ff22);
  box-shadow:0 0 15px #ff00cc22;
}

@keyframes messageShow{
  from{
    opacity:0;
    transform:translateY(15px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.typing{
  display:flex;
  gap:5px;
  width:max-content;
  padding:14px 17px;
  border:1px solid #ff00cc77;
  border-radius:17px;
  border-bottom-left-radius:4px;
  background:#ff00cc18;
}

.typing span{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--pink);
  box-shadow:0 0 8px var(--pink);
  animation:typing 1s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes typing{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.4;
  }
  30%{
    transform:translateY(-7px);
    opacity:1;
  }
}

.bottom{
  padding:15px 18px 10px;
  border-top:1px solid #ffffff18;
  background:#05050966;
}

.input-area{
  display:flex;
  align-items:flex-end;
  gap:10px;
}

textarea{
  flex:1;
  min-height:48px;
  max-height:130px;
  resize:none;
  outline:none;
  padding:14px 16px;
  border:1px solid #ffffff25;
  border-radius:15px;
  color:white;
  background:#ffffff08;
  font-family:Arial,sans-serif;
  font-size:14px;
  line-height:1.4;
  transition:.3s;
}

textarea::placeholder{
  color:#8d8da0;
}

textarea:focus{
  border-color:var(--cyan);
  background:#00ffff08;
  box-shadow:
    0 0 15px #00ffff22,
    inset 0 0 12px #00ffff0d;
}

button{
  position:relative;
  min-width:90px;
  height:48px;
  border:0;
  border-radius:15px;
  color:white;
  background:linear-gradient(
    135deg,
    #0066ff,
    #8b00ff,
    #ff00cc,
    #00ffff
  );
  background-size:300% 300%;
  font-weight:bold;
  cursor:pointer;
  overflow:hidden;
  transition:.25s;
  animation:buttonRGB 5s linear infinite;
}

button:hover{
  transform:translateY(-3px) scale(1.03);
  box-shadow:
    0 0 18px #00ffff77,
    0 0 30px #ff00cc55;
}

button:active{
  transform:scale(.95);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
}

@keyframes buttonRGB{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.clear-row{
  display:flex;
  justify-content:flex-end;
  margin-top:10px;
}

.clear-btn{
  min-width:auto;
  height:auto;
  padding:7px 12px;
  border:1px solid #ff005566;
  border-radius:10px;
  color:#ff7799;
  background:#ff005511;
  font-size:11px;
  animation:none;
}

.clear-btn:hover{
  border-color:#ff0055;
  background:#ff005522;
  box-shadow:0 0 12px #ff005555;
}

.powered{
  margin-top:12px;
  text-align:center;
  color:#888899;
  font-size:12px;
  letter-spacing:1px;
  animation:poweredGlow 3s infinite alternate;
}

.powered span{
  color:var(--cyan);
  font-weight:bold;
  text-shadow:
    0 0 5px var(--cyan),
    0 0 12px var(--cyan);
}

@keyframes poweredGlow{
  from{opacity:.55}
  to{opacity:1}
}

.particle{
  position:fixed;
  width:4px;
  height:4px;
  border-radius:50%;
  pointer-events:none;
  z-index:-1;
  animation:particleFloat linear infinite;
}

@keyframes particleFloat{
  from{
    transform:translateY(110vh) rotate(0deg);
    opacity:0;
  }
  15%{opacity:1}
  85%{opacity:1}
  to{
    transform:translateY(-15vh) rotate(360deg);
    opacity:0;
  }
}

@media(max-width:600px){
  body{
    padding:7px;
  }

  .inner{
    min-height:680px;
  }

  .chat{
    padding:14px;
    max-height:500px;
  }

  .bubble{
    max-width:90%;
    font-size:13px;
  }

  .bottom{
    padding:12px;
  }

  .input-area{
    gap:7px;
  }

  textarea{
    padding:13px;
  }

  button{
    min-width:75px;
  }
}
</style>
</head>

<body>

<div class="app">
  <div class="inner">

    <header class="header">
      <div class="logo">O</div>

      <h1 class="title">OHID AI</h1>

      <p class="subtitle">
        Your intelligent AI companion
      </p>

      <div class="status">
        <span class="status-dot"></span>
        Online and ready
      </div>
    </header>

    <main id="chat" class="chat">
      <div id="welcome" class="welcome">
        <div class="welcome-icon">🤖</div>
        <h2>Welcome to Ohid AI</h2>
        <p>
          Ask me anything and start a smart conversation.
          <br>
          I am ready to help you.
        </p>
      </div>
    </main>

    <div class="bottom">

      <div class="input-area">
        <textarea
          id="messageInput"
          rows="1"
          placeholder="Write your message..."
        ></textarea>

        <button id="sendButton">Send</button>
      </div>

      <div class="clear-row">
        <button class="clear-btn" id="clearButton">
          Clear Chat
        </button>
      </div>

      <div class="powered">
        Powered by <span>Ohid</span>
      </div>

    </div>
  </div>
</div>

<script>
/* এখানে শুধু নিজের Groq API key বসাও */
const GROQ_API_KEY = "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";

const GROQ_API_URL =
  "https://api.groq.com/openai/v1/chat/completions";

const GROQ_MODEL =
  "openai/gpt-oss-20b";

const chat = document.getElementById("chat");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const clearButton = document.getElementById("clearButton");

let conversation = [];

function addMessage(text, sender){
  const oldWelcome = document.getElementById("welcome");

  if(oldWelcome){
    oldWelcome.remove();
  }

  const message = document.createElement("div");
  message.className = "message " + sender;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  message.appendChild(bubble);
  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;
}

function addTyping(){
  const message = document.createElement("div");
  message.id = "typingMessage";
  message.className = "message ai";

  message.innerHTML = `
    <div class="typing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping(){
  const typing = document.getElementById("typingMessage");

  if(typing){
    typing.remove();
  }
}

async function sendMessage(){
  const text = messageInput.value.trim();

  if(!text || sendButton.disabled){
    return;
  }

  if(
    !GROQ_API_KEY ||
    GROQ_API_KEY === "YOUR_GROQ_API_KEY_HERE"
  ){
    addMessage(
      "API key বসানো হয়নি। কোডের GROQ_API_KEY অংশে নিজের Groq API key বসাও।",
      "ai"
    );
    return;
  }

  addMessage(text,"user");

  conversation.push({
    role:"user",
    content:text
  });

  messageInput.value = "";
  messageInput.style.height = "48px";

  sendButton.disabled = true;
  sendButton.textContent = "Wait...";

  addTyping();

  try{
    const response = await fetch(GROQ_API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + GROQ_API_KEY
      },
      body:JSON.stringify({
        model:GROQ_MODEL,
        messages:conversation,
        temperature:.7,
        max_tokens:1024
      })
    });

    const data = await response.json();

    removeTyping();

    if(!response.ok){
      throw new Error(
        data.error?.message || "API request failed"
      );
    }

    const reply =
      data.choices?.[0]?.message?.content ||
      "কোনো উত্তর পাওয়া যায়নি।";

    conversation.push({
      role:"assistant",
      content:reply
    });

    addMessage(reply,"ai");

  }catch(error){
    removeTyping();

    addMessage(
      "API Error: " + error.message,
      "ai"
    );

  }finally{
    sendButton.disabled = false;
    sendButton.textContent = "Send";
    messageInput.focus();
  }
}

function clearChat(){
  conversation = [];

  chat.innerHTML = `
    <div id="welcome" class="welcome">
      <div class="welcome-icon">🤖</div>
      <h2>Welcome to Ohid AI</h2>
      <p>
        Ask me anything and start a smart conversation.
        <br>
        I am ready to help you.
      </p>
    </div>
  `;
}

messageInput.addEventListener("input",function(){
  this.style.height = "48px";
  this.style.height =
    Math.min(this.scrollHeight,130) + "px";
});

messageInput.addEventListener("keydown",function(event){
  if(event.key === "Enter" && !event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
});

sendButton.addEventListener("click",sendMessage);
clearButton.addEventListener("click",clearChat);

const colors = [
  "#00ffff",
  "#ff00cc",
  "#8b00ff",
  "#0066ff"
];

for(let i=0;i<35;i++){
  const particle = document.createElement("div");

  particle.className = "particle";

  const color =
    colors[Math.floor(Math.random() * colors.length)];

  particle.style.left = Math.random() * 100 + "vw";
  particle.style.background = color;
  particle.style.boxShadow = "0 0 10px " + color;
  particle.style.animationDuration =
    8 + Math.random() * 14 + "s";
  particle.style.animationDelay =
    Math.random() * 10 + "s";

  const size = 2 + Math.random() * 4;

  particle.style.width = size + "px";
  particle.style.height = size + "px";

  document.body.appendChild(particle);
}
</script>

</body>
</html>
