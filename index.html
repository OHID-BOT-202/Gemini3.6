<!DOCTYPE html><html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Downloader</title><style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
  background:#050505;
  color:#fff;
}

.box{
  width:92%;
  max-width:430px;
  padding:28px 22px;
  border-radius:24px;
  background:#101010;
  border:2px solid #00f2ea;
  box-shadow:
    0 0 15px #00f2ea,
    0 0 30px #ff0050;
}

h1{
  text-align:center;
  margin-bottom:8px;
  font-size:30px;
}

h1 .t1{
  color:#00f2ea;
  text-shadow:0 0 10px #00f2ea;
}

h1 .t2{
  color:#ff0050;
  text-shadow:0 0 10px #ff0050;
}

p{
  text-align:center;
  color:#aaa;
  font-size:13px;
  margin-bottom:22px;
}

input{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #444;
  outline:none;
  background:#181818;
  color:white;
  font-size:14px;
}

input:focus{
  border-color:#00f2ea;
  box-shadow:0 0 10px #00f2ea;
}

button{
  width:100%;
  margin-top:14px;
  padding:15px;
  border:0;
  border-radius:12px;
  background:linear-gradient(90deg,#00f2ea,#ff0050);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

#status{
  text-align:center;
  margin-top:18px;
  min-height:20px;
  font-size:13px;
  color:#aaa;
}
</style></head><body><div class="box">  <h1>
    <span class="t1">Tik</span><span class="t2">Tok</span>
  </h1>  <p>Paste a public TikTok video link</p><input
id="url"
type="url"
placeholder="https://www.tiktok.com/..."

«»

  <button onclick="downloadTikTok()">
    ⬇ Download Video
  </button>  <div id="status"></div></div><script>
async function downloadTikTok(){

  const input = document.getElementById("url");
  const status = document.getElementById("status");
  const url = input.value.trim();

  if(!url){
    status.innerHTML = "⚠️ TikTok video link দিন";
    return;
  }

  if(!url.includes("tiktok.com")){
    status.innerHTML = "❌ সঠিক TikTok link দিন";
    return;
  }

  status.innerHTML = "⏳ Download শুরু করার চেষ্টা হচ্ছে...";

  try{

    /*
      Browser সরাসরি TikTok page URL-কে
      video file হিসেবে download করতে পারে না।
      যদি URL সরাসরি একটি video file হয়,
      তখন নিচের অংশ কাজ করবে।
    */

    const response = await fetch(url, {
      mode:"cors"
    });

    if(!response.ok){
      throw new Error("Download blocked");
    }

    const blob = await response.blob();

    if(!blob.type.startsWith("video")){
      throw new Error("Not a video file");
    }

    const blobUrl = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = "tiktok-video.mp4";
    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(blobUrl);

    status.innerHTML = "✅ Download complete!";

  }catch(error){

    status.innerHTML =
      "❌ TikTok এই browser থেকে direct download allow করছে না.";

  }
}
</script></body>
</html>
