
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ohid AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#05070d;
  color:#fff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.app{
  width:100%;
  max-width:500px;
  min-height:100vh;
  background:#0d121c;
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
}

/* RGB background glow */
.app::before{
  content:"";
  position:absolute;
  inset:-50%;
  background:conic-gradient(
    #ff0000,
    #ff7300,
    #ffee00,
    #00ff00,
    #00ffff,
    #0066ff,
    #cc00ff,
    #ff0000
  );
  animation:rgbRotate 12s linear infinite;
  opacity:.12;
  filter:blur(70px);
  pointer-events:none;
}

.app>*{
  position:relative;
  z-index:1;
}

@keyframes rgbRotate{
  to{transform:rotate(360deg)}
}

/* RGB border */
.auth,
header,
.composer{
  position:relative;
  border:1px solid transparent;
  background:
    linear-gradient(#151c29,#151c29) padding-box,
    linear-gradient(90deg,
      #ff0000,
      #ff7300,
      #ffee00,
      #00ff00,
      #00ffff,
      #0066ff,
      #cc00ff,
      #ff0000
    ) border-box;
  background-size:100% 100%,400% 100%;
  animation:rgbBorder 8s linear infinite;
}

@keyframes rgbBorder{
  0%{background-position:0 0,0% 50%}
  50%{background-position:0 0,100% 50%}
  100%{background-position:0 0,0% 50%}
}

/* Login / Register */
.auth{
  width:90%;
  max-width:380px;
  margin:auto;
  padding:25px;
  border-radius:18px;
  box-shadow:0 0 25px #00e5ff15;
}

.auth h1{
  text-align:center;
  color:#00e5ff;
  animation:rgbText 5s linear infinite;
}

.auth p{
  text-align:center;
  color:#9ba8bd;
}

@keyframes rgbText{
  0%{color:#ff0000}
  16%{color:#ff7300}
  33%{color:#ffee00}
  50%{color:#00ff00}
  66%{color:#00ffff}
  83%{color:#0066ff}
  100%{color:#ff0000}
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #303b52;
  background:#0c111a;
  color:#fff;
  outline:none;
  margin:7px 0;
}

input:focus{
  border-color:#00c8ff;
  box-shadow:0 0 10px #00c8ff30;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  background:#00c8ff;
  color:#001018;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  filter:brightness(1.15);
}

.auth button{
  width:100%;
  margin-top:10px;
}

.switch{
  text-align:center;
  margin-top:15px;
  color:#9ba8bd;
  cursor:pointer;
}

.switch span{
  color:#00e5ff;
}

.error{
  color:#ff6b6b;
  text-align:center;
  min-height:20px;
  font-size:13px;
}

.hidden{
  display:none!important;
}

/* Header */
header{
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.logo{
  font-weight:bold;
  font-size:20px;
  color:#00e5ff;
  animation:rgbText 5s linear infinite;
}

header small{
  color:#8d9ab0;
}

/* Chat */
.chat{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

.info{
  padding:10px 18px;
  color:#8290a7;
  font-size:12px;
  text-align:center;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.msg{
  max-width:85%;
  padding:12px 14px;
  border-radius:14px;
  line-height:1.5;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.user{
  align-self:flex-end;
  background:#006d8c;
  border:1px solid #00e5ff;
}

.bot{
  align-self:flex-start;
  background:#202b3d;
  border:1px solid #303b52;
}

.typing{
  color:#9ba8bd;
  font-size:13px;
}

/* Composer */
.composer{
  padding:12px;
  display:flex;
  gap:8px;
}

.composer input{
  margin:0;
  flex:1;
}

.composer button{
  padding:12px 15px;
  background:linear-gradient(90deg,
    #ff0000,
    #ff7300,
    #ffee00,
    #00ff00,
    #00ffff,
    #0066ff,
    #cc00ff,
    #ff0000
  );
  background-size:400% 100%;
  animation:rgbButton 8s linear infinite;
  color:#fff;
}

@keyframes rgbButton{
  0%{background-position:0% 50%}
  100%{background-position:400% 50%}
}

.clear{
  background:transparent;
  color:#9ba8bd;
  border:1px solid #303b52;
  padding:8px 12px;
  font-size:12px;
}

.logout{
  background:#263044;
  color:#fff;
  padding:8px 12px;
  font-size:12px;
}

/* Mobile */
@media(max-width:400px){
  header{
    padding:14px;
  }

  header h2{
    font-size:16px;
  }

  .logo{
    font-size:17px;
  }

  .clear,
  .logout{
    padding:7px 9px;
    font-size:11px;
  }

  .messages{
    padding:12px;
  }

  .auth{
    padding:20px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- LOGIN -->
  <div id="loginPage" class="auth">
    <h1>Ohid AI</h1>
    <p>Login to continue</p>

    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPass" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
    <div id="loginError" class="error"></div>

    <div class="switch" onclick="showRegister()">
      Account নেই? <span>Register</span>
    </div>
  </div>

  <!-- REGISTER -->
  <div id="registerPage" class="auth hidden">
    <h1>Create Account</h1>
    <p>Register locally</p>

    <input id="regName" type="text" placeholder="Your name">
    <input id="regEmail" type="email" placeholder="Email">
    <input id="regPass" type="password" placeholder="Password">

    <button onclick="register()">Register</button>
    <div id="regError" class="error"></div>

    <div class="switch" onclick="showLogin()">
      Already have account? <span>Login</span>
    </div>
  </div>

  <!-- CHAT -->
  <div id="chatPage" class="chat hidden">

    <header>
      <div>
        <div class="logo">⚡ Ohid AI</div>
        <small id="welcome"></small>
      </div>

      <div>
        <button class="clear" onclick="clearChat()">Clear</button>
        <button class="logout" onclick="logout()">Logout</button>
      </div>
    </header>

    <div class="info">
      Welcome to Ohid AI
    </div>

    <div id="messages" class="messages"></div>

    <div class="composer">
      <input
        id="prompt"
        type="text"
        placeholder="Message Ohid AI..."
        onkeydown="handleKey(event)"
      >
      <button onclick="sendMessage()">Send</button>
    </div>

  </div>
</div>

<script>
/* ================================
   GROQ API CONFIG
   ================================ */

const GROQ_API_KEY = "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";

const GROQ_URL =
  "https://api.groq.com/openai/v1/chat/completions";

const MODEL = "llama-3.1-8b-instant";


/* ================================
   AUTH
   ================================ */

function getUsers(){
  return JSON.parse(localStorage.getItem("ohid_users") || "[]");
}

function saveUsers(users){
  localStorage.setItem("ohid_users", JSON.stringify(users));
}

function showRegister(){
  loginPage.classList.add("hidden");
  registerPage.classList.remove("hidden");
}

function showLogin(){
  registerPage.classList.add("hidden");
  loginPage.classList.remove("hidden");
}

function register(){
  const name = regName.value.trim();
  const email = regEmail.value.trim().toLowerCase();
  const pass = regPass.value;

  regError.textContent = "";

  if(!name || !email || !pass){
    regError.textContent = "সব ঘর পূরণ করো";
    return;
  }

  if(pass.length < 6){
    regError.textContent = "Password কমপক্ষে ৬ অক্ষরের হতে হবে";
    return;
  }

  const users = getUsers();

  if(users.some(u => u.email === email)){
    regError.textContent = "এই email দিয়ে account আছে";
    return;
  }

  users.push({name,email,pass});
  saveUsers(users);

  alert("Registration successful!");
  showLogin();
}

function login(){
  const email = loginEmail.value.trim().toLowerCase();
  const pass = loginPass.value;

  loginError.textContent = "";

  const user = getUsers().find(
    u => u.email === email && u.pass === pass
  );

  if(!user){
    loginError.textContent = "Email অথবা password ভুল";
    return;
  }

  localStorage.setItem(
    "ohid_current_user",
    JSON.stringify(user)
  );

  openChat(user);
}

function logout(){
  localStorage.removeItem("ohid_current_user");

  chatPage.classList.add("hidden");
  loginPage.classList.remove("hidden");
}

function openChat(user){
  loginPage.classList.add("hidden");
  registerPage.classList.add("hidden");
  chatPage.classList.remove("hidden");

  welcome.textContent = "Hi, " + user.name;
  loadChat();
}

const currentUser = JSON.parse(
  localStorage.getItem("ohid_current_user") || "null"
);

if(currentUser){
  openChat(currentUser);
}


/* ================================
   CHAT
   ================================ */

let chatHistory = [];

function loadChat(){
  const saved = JSON.parse(
    localStorage.getItem("ohid_chat") || "[]"
  );

  chatHistory = saved;
  renderMessages();

  if(chatHistory.length === 0){
    addBotMessage("হ্যালো! আমি Ohid AI। কী জানতে চাও?");
  }
}

function saveChat(){
  localStorage.setItem(
    "ohid_chat",
    JSON.stringify(chatHistory)
  );
}

function addUserMessage(text){
  chatHistory.push({
    role:"user",
    content:text
  });

  renderMessages();
  saveChat();
}

function addBotMessage(text){
  chatHistory.push({
    role:"assistant",
    content:text
  });

  renderMessages();
  saveChat();
}

function renderMessages(){
  messages.innerHTML = "";

  chatHistory.forEach(m => {
    const div = document.createElement("div");

    div.className =
      "msg " + (m.role === "user" ? "user" : "bot");

    div.textContent = m.content;

    messages.appendChild(div);
  });

  messages.scrollTop = messages.scrollHeight;
}

function clearChat(){
  chatHistory = [];
  saveChat();
  renderMessages();

  addBotMessage("Chat cleared. আবার শুরু করি!");
}

function handleKey(e){
  if(e.key === "Enter"){
    sendMessage();
  }
}

async function sendMessage(){

  const text = prompt.value.trim();

  if(!text) return;

  if(
    GROQ_API_KEY ===
    "PASTE_YOUR_GROQ_API_KEY_HERE"
  ){
    alert("প্রথমে GROQ_API_KEY-এ তোমার API key বসাও");
    return;
  }

  prompt.value = "";
  addUserMessage(text);

  const typing = document.createElement("div");

  typing.className = "typing";
  typing.textContent = "Ohid AI is typing...";

  messages.appendChild(typing);
  messages.scrollTop = messages.scrollHeight;

  try{

    const response = await fetch(GROQ_URL,{
      method:"POST",

      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + GROQ_API_KEY
      },

      body:JSON.stringify({
        model:MODEL,
        messages:chatHistory,
        temperature:0.7,
        max_tokens:1024
      })
    });

    const data = await response.json();

    typing.remove();

    if(!response.ok){
      throw new Error(
        data.error?.message || "API Error"
      );
    }

    const reply =
      data.choices?.[0]?.message?.content;

    if(!reply){
      throw new Error("Empty response");
    }

    addBotMessage(reply);

  }catch(err){

    typing.remove();

    addBotMessage(
      "❌ Error: " + err.message
    );

  }
}
</script>

</body>
</html>
