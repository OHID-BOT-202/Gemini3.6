
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ohid bby Ai</title>

<style>
@font-face{
    font-family:"Kalpana";
    src:url("Kalpana UNICODE.ttf") format("truetype");
    font-weight:normal;
    font-style:normal;
    font-display:swap;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    font-family:"Kalpana", Arial, sans-serif;
    background:
        linear-gradient(
            rgba(0,0,0,.12),
            rgba(0,0,0,.12)
        ),
        url("https://i.ibb.co.com/F4nJPjzb/file-000000008e7482118c92ba40bfa3d1fd.png")
        center/cover fixed no-repeat;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.app{
    width:100%;
    max-width:500px;
    height:100vh;
    min-height:550px;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
    background:rgba(0,0,0,.18);
    backdrop-filter:blur(3px);
    border-left:1px solid rgba(255,255,255,.15);
    border-right:1px solid rgba(255,255,255,.15);
}

.app::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    border:2px solid;
    border-image:linear-gradient(
        90deg,
        red,
        orange,
        yellow,
        lime,
        cyan,
        blue,
        violet,
        red
    ) 1;
    animation:borderRGB 2.5s linear infinite;
    z-index:10;
}

@keyframes borderRGB{
    0%{filter:hue-rotate(0deg);}
    100%{filter:hue-rotate(360deg);}
}

@keyframes textRGB{
    0%{color:red;}
    16%{color:orange;}
    33%{color:yellow;}
    50%{color:lime;}
    66%{color:cyan;}
    83%{color:#8b5cf6;}
    100%{color:red;}
}

.header{
    height:75px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 15px;
    background:rgba(0,0,0,.42);
    border-bottom:1px solid rgba(255,255,255,.2);
    z-index:2;
}

.profile{
    width:50px;
    height:50px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid;
    border-color:#00ffff;
    box-shadow:
        0 0 8px #00ffff,
        0 0 18px #ff00ff;
    animation:borderRGB 2.5s linear infinite;
}

.header-info{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.title{
    font-size:23px;
    font-weight:bold;
    white-space:nowrap;
    animation:textRGB 2.5s linear infinite;
}

.status{
    color:#9effc7;
    font-family:Arial,sans-serif;
    font-size:12px;
    margin-top:2px;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:18px 13px 95px;
    display:flex;
    flex-direction:column;
    gap:12px;
    scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
    width:5px;
}

.chat::-webkit-scrollbar-thumb{
    background:linear-gradient(red,blue);
    border-radius:10px;
}

.welcome{
    align-self:center;
    text-align:center;
    max-width:90%;
    padding:12px 15px;
    font-size:16px;
    line-height:1.5;
    border:1px solid #00ffff;
    border-radius:16px;
    background:rgba(0,0,0,.28);
    box-shadow:0 0 12px rgba(0,255,255,.4);
    animation:borderRGB 2.5s linear infinite;
}

.message{
    max-width:86%;
    padding:11px 14px;
    font-size:17px;
    line-height:1.55;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    border:1px solid;
    border-radius:17px;
    background:rgba(0,0,0,.25);
    box-shadow:0 0 10px rgba(0,255,255,.18);
    animation:borderRGB 2.5s linear infinite;
}

.user{
    align-self:flex-end;
    border-color:#00ff88;
    border-bottom-right-radius:4px;
}

.bot{
    align-self:flex-start;
    border-color:#ff00ff;
    border-bottom-left-radius:4px;
}

.message-name{
    display:block;
    font-family:Arial,sans-serif;
    font-size:11px;
    font-weight:bold;
    margin-bottom:4px;
    opacity:.8;
}

.user .message-name{
    color:#00ff88;
}

.bot .message-name{
    color:#ff55ff;
}

.input-area{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    display:flex;
    gap:8px;
    padding:12px;
    background:rgba(0,0,0,.55);
    border-top:1px solid rgba(255,255,255,.2);
    z-index:3;
}

#messageInput{
    flex:1;
    min-width:0;
    height:48px;
    padding:0 15px;
    color:white;
    font-family:"Kalpana", Arial, sans-serif;
    font-size:17px;
    outline:none;
    border:2px solid;
    border-radius:25px;
    background:rgba(0,0,0,.28);
    border-color:#00ffff;
    animation:borderRGB 2.5s linear infinite;
}

#messageInput::placeholder{
    color:rgba(255,255,255,.65);
}

#sendBtn{
    width:48px;
    height:48px;
    flex-shrink:0;
    border:none;
    border-radius:50%;
    cursor:pointer;
    color:white;
    font-size:21px;
    background:linear-gradient(
        135deg,
        #ff0055,
        #7c00ff,
        #00c8ff
    );
    box-shadow:0 0 12px rgba(0,255,255,.5);
    transition:.2s;
}

#sendBtn:hover{
    transform:scale(1.08);
}

#sendBtn:active{
    transform:scale(.95);
}

#sendBtn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.typing{
    align-self:flex-start;
    display:none;
    gap:5px;
    padding:12px 15px;
    border:1px solid #00ffff;
    border-radius:17px;
    background:rgba(0,0,0,.3);
}

.typing span{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#00ffff;
    animation:typing 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,100%{
        opacity:.25;
        transform:translateY(0);
    }
    50%{
        opacity:1;
        transform:translateY(-4px);
    }
}

.error{
    color:#ff8f8f;
    border-color:#ff3333;
}

@media(max-width:520px){
    body{
        align-items:stretch;
    }

    .app{
        max-width:none;
        border:none;
    }

    .title{
        font-size:21px;
    }

    .message{
        max-width:90%;
        font-size:16px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <img
            class="profile"
            src="https://i.ibb.co/G4sHV2cW/20260822-000544.jpg"
            alt="Ohid bby Ai"
        >

        <div class="header-info">
            <div class="title">Ohid bby Ai</div>
            <div class="status">● Online • Powered by Ohid</div>
        </div>
    </div>

    <div class="chat" id="chat">

        <div class="welcome">
            আসসালামু আলাইকুম! আমি <b>Ohid bby Ai</b>।<br>
            আমাকে যেকোনো প্রশ্ন করতে পারো।
        </div>

        <div class="typing" id="typing">
            <span></span>
            <span></span>
            <span></span>
        </div>

    </div>

    <div class="input-area">
        <input
            id="messageInput"
            type="text"
            placeholder="মেসেজ লিখুন..."
            autocomplete="off"
        >

        <button id="sendBtn" title="Send">➤</button>
    </div>

</div>

<script>
const GROQ_API_KEY = "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";

const API_URL =
    "https://api.groq.com/openai/v1/chat/completions";

const MODEL =
    "lopenai/gpt-oss-20b";

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const typing = document.getElementById("typing");

let conversation = [
    {
        role:"system",
        content:
        "তোমার নাম Ohid bby Ai। " +
        "ব্যবহারকারী তোমাকে কী তৈরি করেছে জিজ্ঞেস করলে বলবে, " +
        "তোমাকে Ohid তৈরি করেছে। " +
        "নিজেকে ChatGPT বলবে না। " +
        "সবসময় সুন্দর ও সহজ বাংলায় উত্তর দেবে।"
    }
];

function addMessage(text, type){
    const message = document.createElement("div");
    message.className = "message " + type;

    const name = document.createElement("span");
    name.className = "message-name";
    name.textContent = type === "user" ? "You" : "Ohid bby Ai";

    const content = document.createElement("span");
    content.textContent = text;

    message.appendChild(name);
    message.appendChild(content);

    chat.insertBefore(message, typing);
    chat.scrollTop = chat.scrollHeight;
}

function showTyping(show){
    typing.style.display = show ? "flex" : "none";
    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage(){
    const text = input.value.trim();

    if(!text || sendBtn.disabled){
        return;
    }

    if(
        GROQ_API_KEY === "YOUR_GROQ_API_KEY" ||
        GROQ_API_KEY.length < 10
    ){
        addMessage(
            "প্রথমে কোডের মধ্যে YOUR_GROQ_API_KEY-এর জায়গায় তোমার Groq API key বসাও।",
            "bot"
        );
        return;
    }

    addMessage(text, "user");
    input.value = "";
    sendBtn.disabled = true;
    showTyping(true);

    conversation.push({
        role:"user",
        content:text
    });

    try{
        const response = await fetch(API_URL, {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer " + GROQ_API_KEY
            },
            body:JSON.stringify({
                model:MODEL,
                messages:conversation,
                temperature:0.8,
                max_tokens:700
            })
        });

        const data = await response.json();

        if(!response.ok){
            throw new Error(
                data.error?.message || "API request failed"
            );
        }

        const reply =
            data.choices?.[0]?.message?.content ||
            "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।";

        conversation.push({
            role:"assistant",
            content:reply
        });

        addMessage(reply, "bot");

    }catch(error){
        addMessage(
            "দুঃখিত, সমস্যা হয়েছে:\n" + error.message,
            "bot error"
        );
    }finally{
        showTyping(false);
        sendBtn.disabled = false;
        input.focus();
    }
}

sendBtn.addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event){
    if(event.key === "Enter"){
        event.preventDefault();
        sendMessage();
    }
});
</script>

</body>
</html>
