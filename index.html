<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ohid AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --cyan: #00ffff;
      --pink: #ff00cc;
      --purple: #8b00ff;
      --blue: #0066ff;
      --bg: #050509;
      --panel: rgba(10, 10, 20, 0.86);
      --text: #ffffff;
      --muted: #a7a7b5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: #050509;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -50%;
      z-index: -3;
      background:
        radial-gradient(circle at 20% 20%, #ff00cc44, transparent 30%),
        radial-gradient(circle at 80% 30%, #00ffff44, transparent 30%),
        radial-gradient(circle at 50% 90%, #8b00ff44, transparent 30%);
      animation: backgroundMove 12s ease-in-out infinite alternate;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(90deg, transparent 49%, #ffffff08 50%, transparent 51%),
        linear-gradient(transparent 49%, #ffffff08 50%, transparent 51%);
      background-size: 45px 45px;
      animation: gridMove 8s linear infinite;
      pointer-events: none;
    }

    @keyframes backgroundMove {
      0% {
        transform: translate(-5%, -5%) rotate(0deg) scale(1);
      }

      100% {
        transform: translate(5%, 5%) rotate(12deg) scale(1.2);
      }
    }

    @keyframes gridMove {
      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(45px, 45px);
      }
    }

    .app {
      width: 100%;
      max-width: 900px;
      padding: 2px;
      border-radius: 25px;
      background: linear-gradient(
        90deg,
        var(--cyan),
        var(--pink),
        var(--purple),
        var(--blue),
        var(--cyan)
      );
      background-size: 400% 400%;
      animation: rgbBorder 8s linear infinite;
      box-shadow:
        0 0 15px #00ffff55,
        0 0 35px #ff00cc33,
        0 0 70px #8b00ff22;
    }

    @keyframes rgbBorder {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .inner {
      min-height: 650px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 23px;
      background: var(--panel);
      backdrop-filter: blur(18px);
    }

    .header {
      position: relative;
      padding: 22px 20px;
      text-align: center;
      border-bottom: 1px solid #ffffff16;
      overflow: hidden;
    }

    .header::after {
      content: "";
      position: absolute;
      left: -100%;
      bottom: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--cyan),
        var(--pink),
        transparent
      );
      animation: headerLine 4s linear infinite;
    }

    @keyframes headerLine {
      0% {
        left: -100%;
      }

      100% {
        left: 100%;
      }
    }

    .logo {
      position: relative;
      width: 76px;
      height: 76px;
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--cyan);
      border-radius: 50%;
      color: var(--cyan);
      font-size: 30px;
      font-weight: bold;
      text-shadow: 0 0 12px var(--cyan);
      box-shadow:
        0 0 12px var(--cyan),
        inset 0 0 15px #00ffff55;
      animation: logoPulse 2.5s ease-in-out infinite;
    }

    .logo::before,
    .logo::after {
      content: "";
      position: absolute;
      inset: -9px;
      border: 1px solid var(--pink);
      border-radius: 50%;
      animation: logoRing 4s linear infinite;
    }

    .logo::after {
      inset: -16px;
      border-color: var(--purple);
      animation-direction: reverse;
      animation-duration: 6s;
    }

    @keyframes logoPulse {
      0%,
      100% {
        transform: scale(1);
        box-shadow:
          0 0 12px var(--cyan),
          inset 0 0 15px #00ffff55;
      }

      50% {
        transform: scale(1.08);
        box-shadow:
          0 0 28px var(--cyan),
          0 0 50px #ff00cc55,
          inset 0 0 20px #00ffff99;
      }
    }

    @keyframes logoRing {
      from {
        transform: rotate(0deg) scale(1);
      }

      to {
        transform: rotate(360deg) scale(1.08);
      }
    }

    .title {
      margin: 0;
      font-size: clamp(27px, 6vw, 42px);
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(
        90deg,
        var(--cyan),
        var(--pink),
        var(--purple),
        var(--cyan)
      );
      background-size: 300% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: titleRGB 5s linear infinite;
    }

    @keyframes titleRGB {
      to {
        background-position: 300% center;
      }
    }

    .subtitle {
      margin: 9px 0 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 1px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 13px;
      padding: 7px 13px;
      border: 1px solid #00ffcc55;
      border-radius: 30px;
      color: #00ffcc;
      background: #00ffcc0d;
      font-size: 12px;
      animation: statusGlow 2s ease-in-out infinite alternate;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00ffcc;
      box-shadow: 0 0 10px #00ffcc;
      animation: dotBlink 1.3s infinite;
    }

    @keyframes statusGlow {
      from {
        box-shadow: 0 0 0 #00ffcc00;
      }

      to {
        box-shadow: 0 0 15px #00ffcc33;
      }
    }

    @keyframes dotBlink {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    .chat {
      flex: 1;
      min-height: 350px;
      max-height: 470px;
      overflow-y: auto;
      padding: 22px;
      scroll-behavior: smooth;
    }

    .chat::-webkit-scrollbar {
      width: 6px;
    }

    .chat::-webkit-scrollbar-thumb {
      border-radius: 20px;
      background: linear-gradient(var(--cyan), var(--pink));
    }

    .welcome {
      padding: 30px 15px;
      text-align: center;
      color: #bdbdcc;
      animation: welcomeShow 1s ease both;
    }

    .welcome-icon {
      margin-bottom: 15px;
      font-size: 45px;
      animation: welcomeFloat 3s ease-in-out infinite;
    }

    .welcome h2 {
      margin: 0 0 10px;
      color: #ffffff;
      font-size: 22px;
    }

    .welcome p {
      margin: 0;
      font-size: 13px;
      line-height: 1.7;
    }

    @keyframes welcomeShow {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes welcomeFloat {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-9px);
      }
    }

    .message {
      display: flex;
      margin: 15px 0;
      animation: messageShow 0.35s ease both;
    }

    @keyframes messageShow {
      from {
        opacity: 0;
        transform: translateY(15px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 82%;
      padding: 13px 16px;
      border-radius: 17px;
      font-size: 14px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      color: #ffffff;
      border: 1px solid #00ffff88;
      border-bottom-right-radius: 4px;
      background: linear-gradient(135deg, #0066ff55, #00ffff22);
      box-shadow: 0 0 15px #00ffff18;
    }

    .ai .bubble {
      color: #eeeeff;
      border: 1px solid #ff00cc66;
      border-bottom-left-radius: 4px;
      background: linear-gradient(135deg, #ff00cc22, #8b00ff22);
      box-shadow: 0 0 15px #ff00cc15;
    }

    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      width: fit-content;
      padding: 14px 17px;
      border: 1px solid #ff00cc66;
      border-radius: 17px;
      border-bottom-left-radius: 4px;
      background: #ff00cc16;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 8px var(--pink);
      animation: typingBounce 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typingBounce {
      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.45;
      }

      30% {
        transform: translateY(-7px);
        opacity: 1;
      }
    }

    .bottom {
      padding: 15px 18px 10px;
      border-top: 1px solid #ffffff16;
      background: #05050955;
    }

    .input-area {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 130px;
      resize: none;
      outline: none;
      padding: 14px 16px;
      border: 1px solid #ffffff22;
      border-radius: 15px;
      color: #ffffff;
      background: #ffffff08;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.4;
      transition: 0.3s ease;
    }

    textarea::placeholder {
      color: #8f8fa2;
    }

    textarea:focus {
      border-color: var(--cyan);
      background: #00ffff08;
      box-shadow:
        0 0 12px #00ffff22,
        inset 0 0 12px #00ffff0c;
    }

    button {
      position: relative;
      min-width: 90px;
      height: 48px;
      border: 0;
      border-radius: 15px;
      color: #ffffff;
      background: linear-gradient(
        135deg,
        #0066ff,
        #8b00ff,
        #ff00cc,
        #00ffff
      );
      background-size: 300% 300%;
      font-weight: bold;
      cursor: pointer;
      overflow: hidden;
      transition: 0.25s ease;
      animation: buttonRGB 5s linear infinite;
    }

    button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 70%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        #ffffff77,
        transparent
      );
      transform: skewX(-20deg);
      animation: buttonShine 3.5s infinite;
    }

    button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow:
        0 0 15px #00ffff66,
        0 0 25px #ff00cc44;
    }

    button:active {
      transform: scale(0.95);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
      transform: none;
    }

    @keyframes buttonRGB {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes buttonShine {
      0% {
        left: -100%;
      }

      45%,
      100% {
        left: 150%;
      }
    }

    .clear-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .clear-btn {
      min-width: auto;
      height: auto;
      padding: 7px 12px;
      border: 1px solid #ff005544;
      border-radius: 10px;
      color: #ff7799;
      background: #ff00550d;
      font-size: 11px;
      animation: none;
    }

    .clear-btn:hover {
      border-color: #ff0055;
      background: #ff005522;
      box-shadow: 0 0 12px #ff005533;
    }

    .powered {
      margin-top: 12px;
      text-align: center;
      color: #888899;
      font-size: 12px;
      letter-spacing: 1px;
      animation: poweredGlow 3s infinite alternate;
    }

    .powered span {
      color: var(--cyan);
      font-weight: bold;
      text-shadow:
        0 0 5px var(--cyan),
        0 0 12px var(--cyan);
    }

    @keyframes poweredGlow {
      from {
        opacity: 0.55;
      }

      to {
        opacity: 1;
      }
    }

    .particle {
      position: fixed;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {
      from {
        transform: translateY(110vh) rotate(0deg);
        opacity: 0;
      }

      15% {
        opacity: 1;
      }

      85% {
        opacity: 1;
      }

      to {
        transform: translateY(-15vh) rotate(360deg);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 8px;
      }

      .inner {
        min-height: 680px;
      }

      .header {
        padding: 20px 12px;
      }

      .chat {
        padding: 15px;
        max-height: 500px;
      }

      .bubble {
        max-width: 90%;
        font-size: 13px;
      }

      .bottom {
        padding: 12px;
      }

      .input-area {
        gap: 7px;
      }

      textarea {
        min-height: 46px;
        padding: 13px;
      }

      button {
        min-width: 75px;
        height: 46px;
      }

      .title {
        letter-spacing: 2px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="inner">

      <header class="header">
        <div class="logo">O</div>

        <h1 class="title">OHID AI</h1>

        <p class="subtitle">
          Your intelligent AI companion
        </p>

        <div class="status">
          <span class="status-dot"></span>
          Online and ready
        </div>
      </header>

      <main id="chat" class="chat">
        <div id="welcome" class="welcome">
          <div class="welcome-icon">🤖</div>
          <h2>Welcome to Ohid AI</h2>
          <p>
            Ask me anything and start a smart conversation.
            <br />
            I am ready to help you.
          </p>
        </div>
      </main>

      <div class="bottom">
        <div class="input-area">
          <textarea
            id="messageInput"
            placeholder="Write your message..."
            rows="1"
          ></textarea>

          <button id="sendButton">
            Send
          </button>
        </div>

        <div class="clear-row">
          <button class="clear-btn" id="clearButton">
            Clear Chat
          </button>
        </div>

        <div class="powered">
          Powered by <span>Ohid</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    /*
      IMPORTANT:
      Replace the text below with your own Groq API key.
      Never publish your real API key in a public website.
    */

    const GROQ_API_KEY = "এখানে_তোমার_GROQ_API_KEY_বসাও";

    const GROQ_API_URL =
      "https://api.groq.com/openai/v1/chat/completions";

    const GROQ_MODEL =
      "llama-3.1-8b-instant";

    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const clearButton = document.getElementById("clearButton");

    let conversation = [];

    function addMessage(text, sender) {
      if (welcome) {
        welcome.remove();
      }

      const message = document.createElement("div");
      message.className = "message " + sender;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      message.appendChild(bubble);
      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
    }

    function addTyping() {
      const message = document.createElement("div");
      message.className = "message ai";
      message.id = "typingMessage";

      const typing = document.createElement("div");
      typing.className = "typing";

      typing.innerHTML = `
        <span></span>
        <span></span>
        <span></span>
      `;

      message.appendChild(typing);
      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
    }

    function removeTyping() {
      const typingMessage = document.getElementById("typingMessage");

      if (typingMessage) {
        typingMessage.remove();
      }
    }

    async function sendMessage() {
      const text = messageInput.value.trim();

      if (!text || sendButton.disabled) {
        return;
      }

      if (
        !GROQ_API_KEY ||
        GROQ_API_KEY === "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"
      ) {
        addMessage(
          "প্রথমে JavaScript-এর GROQ_API_KEY অংশে তোমার Groq API key বসাও।",
          "ai"
        );
        return;
      }

      addMessage(text, "user");

      conversation.push({
        role: "user",
        content: text
      });

      messageInput.value = "";
      messageInput.style.height = "48px";

      sendButton.disabled = true;
      sendButton.textContent = "Wait...";

      addTyping();

      try {
        const response = await fetch(GROQ_API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + GROQ_API_KEY
          },
          body: JSON.stringify({
            model: GROQ_MODEL,
            messages: conversation,
            temperature: 0.7,
            max_tokens: 1024
          })
        });

        const data = await response.json();

        removeTyping();

        if (!response.ok) {
          throw new Error(
            data.error?.message || "API request failed"
          );
        }

        const reply =
          data.choices?.[0]?.message?.content ||
          "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।";

        conversation.push({
          role: "assistant",
          content: reply
        });

        addMessage(reply, "ai");
      } catch (error) {
        removeTyping();

        addMessage(
          "Error: " + error.message,
          "ai"
        );
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "Send";
        messageInput.focus();
      }
    }

    function clearChat() {
      conversation = [];

      chat.innerHTML = `
        <div id="welcome" class="welcome">
          <div class="welcome-icon">🤖</div>
          <h2>Welcome to Ohid AI</h2>
          <p>
            Ask me anything and start a smart conversation.
            <br />
            I am ready to help you.
          </p>
        </div>
      `;
    }

    messageInput.addEventListener("input", function () {
      this.style.height = "48px";
      this.style.height = Math.min(this.scrollHeight, 130) + "px";
    });

    messageInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    sendButton.addEventListener("click", sendMessage);
    clearButton.addEventListener("click", clearChat);

    for (let i = 0; i < 35; i++) {
      const particle = document.createElement("div");
      particle.className = "particle";

      const colors = [
        "#00ffff",
        "#ff00cc",
        "#8b00ff",
        "#0066ff"
      ];

      particle.style.left = Math.random() * 100 + "vw";
      particle.style.background =
        colors[Math.floor(Math.random() * colors.length)];
      particle.style.boxShadow =
        "0 0 10px " + particle.style.background;
      particle.style.animationDuration =
        8 + Math.random() * 14 + "s";
      particle.style.animationDelay =
        Math.random() * 10 + "s";
      particle.style.width =
        2 + Math.random() * 4 + "px";
      particle.style.height =
        particle.style.width;

      document.body.appendChild(particle);
    }
  </script>
</body>
</html>
