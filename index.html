<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ohid bby Ai</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --rgb:#ff003c;
}

body{
  margin:0;
  min-height:100vh;
  background:#000;
  font-family:Arial,sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.app{
  width:100%;
  max-width:500px;
  height:100vh;
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;

  background:
    linear-gradient(
      rgba(0,0,0,.04),
      rgba(0,0,0,.06)
    ),
    url("https://i.ibb.co.com/F4nJPjzb/file-000000008e7482118c92ba40bfa3d1fd.png");

  background-size:cover;
  background-position:center;

  border:2px solid var(--rgb);
  animation:borderRGB 2.5s linear infinite;
}


/* ================= HEADER ================= */

.header{
  height:70px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  gap:12px;

  padding:10px 15px;

  background:rgba(0,0,0,.88);

  border-bottom:2px solid var(--rgb);

  animation:borderRGB 2.5s linear infinite;

  z-index:5;
}

.profile{
  width:46px;
  height:46px;

  object-fit:cover;

  border-radius:50%;

  border:2px solid var(--rgb);

  animation:borderRGB 2.5s linear infinite;
}

.header-info{
  flex:1;
  min-width:0;
}

.header-info h2{
  margin:0;

  font-size:18px;

  animation:textRGB 2.5s linear infinite;
}

.online{
  margin-top:4px;

  color:#00ff66;

  font-size:12px;
}


/* ================= CHAT ================= */

.chat{
  flex:1;

  overflow-y:auto;

  padding:18px 12px 100px;

  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
  width:4px;
}

.chat::-webkit-scrollbar-thumb{
  background:var(--rgb);
  border-radius:10px;
}


.welcome{
  margin:20px 10px;

  text-align:center;

  color:#fff;

  font-size:14px;

  line-height:1.6;

  text-shadow:0 0 5px #000;
}

.welcome strong{
  animation:textRGB 2.5s linear infinite;
}


/* ================= MESSAGE ================= */

.message{
  width:fit-content;

  max-width:82%;

  margin:10px 0;

  padding:11px 14px;

  background:transparent !important;

  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;

  color:#fff;

  border:2px solid var(--rgb);

  border-radius:16px;

  box-shadow:0 0 10px var(--rgb);

  line-height:1.5;

  word-wrap:break-word;

  white-space:pre-wrap;

  text-shadow:0 0 4px #000;

  animation:
    messageIn .25s ease,
    borderRGB 2.5s linear infinite;
}

.bot{
  margin-right:auto;

  border-top-left-radius:4px;
}

.user{
  margin-left:auto;

  border-top-right-radius:4px;
}

.message-name{
  display:block;

  margin-bottom:4px;

  font-size:11px;

  font-weight:bold;

  animation:textRGB 2.5s linear infinite;
}


/* ================= TYPING ================= */

.typing{
  display:none;

  width:fit-content;

  padding:12px 16px;

  margin:10px 0;

  background:transparent;

  border:2px solid var(--rgb);

  border-radius:16px;

  box-shadow:0 0 10px var(--rgb);

  animation:borderRGB 2.5s linear infinite;
}

.typing span{
  display:inline-block;

  width:7px;
  height:7px;

  margin:0 3px;

  border-radius:50%;

  background:var(--rgb);

  animation:typing .6s infinite alternate;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}


/* ================= INPUT ================= */

.input-area{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  display:flex;

  gap:8px;

  padding:12px;

  background:rgba(0,0,0,.90);

  border-top:2px solid var(--rgb);

  animation:borderRGB 2.5s linear infinite;

  z-index:5;
}

#messageInput{
  flex:1;

  min-width:0;

  height:46px;

  padding:0 15px;

  outline:none;

  background:transparent;

  color:#fff;

  border:2px solid var(--rgb);

  border-radius:25px;

  font-size:15px;

  box-shadow:0 0 10px var(--rgb);

  animation:borderRGB 2.5s linear infinite;
}

#messageInput::placeholder{
  color:#ddd;
}

#sendBtn{
  width:48px;
  height:46px;

  flex-shrink:0;

  border:2px solid var(--rgb);

  border-radius:50%;

  background:transparent;

  color:var(--rgb);

  font-size:21px;

  cursor:pointer;

  box-shadow:0 0 14px var(--rgb);

  animation:
    borderRGB 2.5s linear infinite,
    textRGB 2.5s linear infinite;
}

#sendBtn:active{
  transform:scale(.88);
}

#sendBtn:disabled{
  opacity:.5;
}


/* ================= RGB BORDER ================= */

@keyframes borderRGB{

  0%{
    border-color:#ff003c;
    box-shadow:0 0 12px #ff003c;
  }

  16%{
    border-color:#ff00e6;
    box-shadow:0 0 12px #ff00e6;
  }

  33%{
    border-color:#8000ff;
    box-shadow:0 0 12px #8000ff;
  }

  50%{
    border-color:#00c8ff;
    box-shadow:0 0 12px #00c8ff;
  }

  66%{
    border-color:#00ff66;
    box-shadow:0 0 12px #00ff66;
  }

  83%{
    border-color:#fff000;
    box-shadow:0 0 12px #fff000;
  }

  100%{
    border-color:#ff003c;
    box-shadow:0 0 12px #ff003c;
  }
}


/* ================= RGB TEXT ================= */

@keyframes textRGB{

  0%{
    color:#ff003c;
  }

  16%{
    color:#ff00e6;
  }

  33%{
    color:#8000ff;
  }

  50%{
    color:#00c8ff;
  }

  66%{
    color:#00ff66;
  }

  83%{
    color:#fff000;
  }

  100%{
    color:#ff003c;
  }
}


/* ================= MESSAGE ANIMATION ================= */

@keyframes messageIn{

  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}


/* ================= TYPING ANIMATION ================= */

@keyframes typing{

  from{
    opacity:.3;
    transform:translateY(0);
  }

  to{
    opacity:1;
    transform:translateY(-5px);
  }
}


/* ================= DESKTOP ================= */

@media(min-width:501px){

  .app{
    height:95vh;

    border-radius:18px;
  }

}
</style>
</head>


<body>

<div class="app">


  <!-- HEADER -->

  <div class="header">

    <img
      class="profile"
      src="https://i.ibb.co/G4sHV2cW/20260822-000544.jpg"
      alt="Ohid bby Ai"
    >

    <div class="header-info">

      <h2>Ohid bby Ai</h2>

      <div class="online">
        ● Online now
      </div>

    </div>

  </div>


  <!-- CHAT -->

  <div class="chat" id="chat">

    <div class="welcome">

      Welcome to
      <strong>Ohid bby Ai</strong>

      <br>

      Ohid AI-এর সাথে কথা বলো।

    </div>


    <div class="message bot">

      <span class="message-name">
        Ohid bby Ai
      </span>

      হাই! আমি Ohid bby Ai।
      তোমাকে কীভাবে সাহায্য করতে পারি?

    </div>


    <!-- TYPING -->

    <div class="typing" id="typing">

      <span></span>
      <span></span>
      <span></span>

    </div>

  </div>


  <!-- INPUT -->

  <div class="input-area">

    <input
      type="text"
      id="messageInput"
      placeholder="Write a message..."
      autocomplete="off"
    >

    <button
      id="sendBtn"
      aria-label="Send message"
    >
      ➤
    </button>

  </div>

</div>


<script>

/* =========================================
   GEMINI API KEY
   =========================================

   এখানে নতুন Gemini API key বসাও।
*/

const API_KEY =
"AQ.Ab8RN6L0AzgErmEfI6YZmoZCyIeCLEgnC0Jql0MmGFvS4s4vLg";


/* =========================================
   GEMINI MODEL
   ========================================= */

const API_URL =
"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key="
+ API_KEY;


/* =========================================
   ELEMENTS
   ========================================= */

const chat =
document.getElementById("chat");

const input =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const typing =
document.getElementById("typing");


/* =========================================
   CONVERSATION
   ========================================= */

const conversation = [];


/* =========================================
   ADD MESSAGE
   ========================================= */

function addMessage(text,type){

  const message =
  document.createElement("div");

  message.className =
  "message " + type;


  if(type === "bot"){

    const name =
    document.createElement("span");

    name.className =
    "message-name";

    name.textContent =
    "Ohid bby Ai";

    message.appendChild(name);

    message.appendChild(
      document.createTextNode(text)
    );

  }else{

    message.textContent =
    text;

  }


  chat.insertBefore(
    message,
    typing
  );


  chat.scrollTop =
  chat.scrollHeight;
}


/* =========================================
   TYPING
   ========================================= */

function showTyping(show){

  typing.style.display =
  show ? "block" : "none";

  chat.scrollTop =
  chat.scrollHeight;
}


/* =========================================
   ASK GEMINI
   ========================================= */

async function askGemini(userText){

  conversation.push({

    role:"user",

    parts:[
      {
        text:
        "তুমি Ohid bby Ai নামের একটি বন্ধুসুলভ বাংলা AI assistant। " +
        "সহজ, ভদ্র এবং স্বাভাবিকভাবে উত্তর দাও। " +
        "ব্যবহারকারী বাংলা লিখলে বাংলায় উত্তর দাও। " +
        "প্রয়োজনে English ব্যবহার করতে পারো।\n\n" +
        userText
      }
    ]

  });


  const response =
  await fetch(
    API_URL,
    {
      method:"POST",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:JSON.stringify({

        contents:
        conversation,

        generationConfig:{
          maxOutputTokens:700
        }

      })
    }
  );


  const data =
  await response.json();


  if(!response.ok){

    throw new Error(
      data.error?.message ||
      "Gemini API request failed"
    );

  }


  const reply =
  data.candidates?.[0]?.content?.parts?.[0]?.text ||
  "দুঃখিত, কোনো উত্তর পাওয়া যায়নি।";


  conversation.push({

    role:"model",

    parts:[
      {
        text:reply
      }
    ]

  });


  return reply;
}


/* =========================================
   SEND MESSAGE
   ========================================= */

async function sendMessage(){

  const text =
  input.value.trim();


  if(!text)
    return;


  if(
    API_KEY ===
    "YOUR_NEW_GEMINI_API_KEY"
  ){

    addMessage(
      "⚠️ প্রথমে API_KEY জায়গায় তোমার Gemini API key বসাও।",
      "bot"
    );

    return;
  }


  addMessage(
    text,
    "user"
  );


  input.value = "";

  input.disabled = true;

  sendBtn.disabled = true;


  showTyping(true);


  try{

    const reply =
    await askGemini(text);


    showTyping(false);


    addMessage(
      reply,
      "bot"
    );


  }catch(error){

    showTyping(false);


    addMessage(
      "⚠️ API Error: " +
      error.message,
      "bot"
    );

  }


  input.disabled = false;

  sendBtn.disabled = false;

  input.focus();
}


/* =========================================
   SEND BUTTON
   ========================================= */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* =========================================
   ENTER TO SEND
   ========================================= */

input.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      sendMessage();

    }

  }
);

</script>

</body>
  </html>
