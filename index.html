<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ohid AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:10px;
  font-family:Arial,sans-serif;
  color:white;
  background:#050509;
  overflow:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:-50%;
  z-index:-2;
  background:
    radial-gradient(circle at 20% 20%,#ff00cc55,transparent 30%),
    radial-gradient(circle at 80% 30%,#00ffff55,transparent 30%),
    radial-gradient(circle at 50% 90%,#8b00ff55,transparent 30%);
  animation:bgMove 12s ease-in-out infinite alternate;
}

@keyframes bgMove{
  from{transform:translate(-5%,-5%) rotate(0deg) scale(1)}
  to{transform:translate(5%,5%) rotate(12deg) scale(1.2)}
}

.app{
  width:100%;
  max-width:900px;
  padding:2px;
  border-radius:25px;
  background:linear-gradient(
    90deg,#00ffff,#ff00cc,#8b00ff,#0066ff,#00ffff
  );
  background-size:400% 400%;
  animation:rgbBorder 8s linear infinite;
  box-shadow:0 0 25px #00ffff55;
}

@keyframes rgbBorder{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.inner{
  min-height:650px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  border-radius:23px;
  background:rgba(7,7,18,.94);
  backdrop-filter:blur(15px);
}

.header{
  text-align:center;
  padding:25px 15px;
  border-bottom:1px solid #ffffff18;
}

.logo{
  width:75px;
  height:75px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  border:2px solid #00ffff;
  border-radius:50%;
  color:#00ffff;
  font-size:32px;
  font-weight:bold;
  text-shadow:0 0 15px #00ffff;
  box-shadow:0 0 20px #00ffff;
  animation:pulse 2.5s infinite;
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.08);box-shadow:0 0 40px #00ffff}
}

.title{
  margin:15px 0 8px;
  font-size:clamp(28px,7vw,45px);
  letter-spacing:3px;
  background:linear-gradient(
    90deg,#00ffff,#ff00cc,#8b00ff,#00ffff
  );
  background-size:300%;
  color:transparent;
  -webkit-background-clip:text;
  background-clip:text;
  animation:titleMove 5s linear infinite;
}

@keyframes titleMove{
  to{background-position:300% center}
}

.subtitle{
  color:#aaaabd;
  font-size:13px;
  margin:0 0 12px;
}

.status{
  display:inline-flex;
  gap:7px;
  align-items:center;
  padding:7px 13px;
  border:1px solid #00ffcc66;
  border-radius:30px;
  color:#00ffcc;
  font-size:12px;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#00ffcc;
  box-shadow:0 0 10px #00ffcc;
  animation:blink 1.2s infinite;
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:.3}
}

.chat{
  flex:1;
  min-height:350px;
  max-height:470px;
  overflow-y:auto;
  padding:20px;
}

.chat::-webkit-scrollbar{width:6px}
.chat::-webkit-scrollbar-thumb{
  background:linear-gradient(#00ffff,#ff00cc);
  border-radius:20px;
}

.welcome{
  text-align:center;
  padding:35px 15px;
  color:#bbb;
}

.welcome-icon{
  font-size:45px;
  animation:float 3s infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.welcome h2{
  color:white;
  font-size:22px;
}

.welcome p{
  font-size:13px;
  line-height:1.7;
}

.message{
  display:flex;
  margin:15px 0;
  animation:showMessage .35s ease;
}

.user{justify-content:flex-end}
.ai{justify-content:flex-start}

@keyframes showMessage{
  from{
    opacity:0;
    transform:translateY(15px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.bubble{
  max-width:85%;
  padding:13px 16px;
  border-radius:17px;
  font-size:14px;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .bubble{
  border:1px solid #00ffff99;
  border-bottom-right-radius:4px;
  background:linear-gradient(135deg,#0066ff55,#00ffff22);
}

.ai .bubble{
  border:1px solid #ff00cc88;
  border-bottom-left-radius:4px;
  background:linear-gradient(135deg,#ff00cc22,#8b00ff22);
}

.typing{
  display:flex;
  gap:5px;
  padding:14px 17px;
  border:1px solid #ff00cc88;
  border-radius:17px;
  background:#ff00cc18;
}

.typing span{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#ff00cc;
  animation:typing 1s infinite;
}

.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}

@keyframes typing{
  0%,60%,100%{transform:translateY(0);opacity:.4}
  30%{transform:translateY(-7px);opacity:1}
}

.bottom{
  padding:15px 18px 10px;
  border-top:1px solid #ffffff18;
}

.input-area{
  display:flex;
  align-items:flex-end;
  gap:10px;
}

textarea{
  flex:1;
  min-height:48px;
  max-height:130px;
  resize:none;
  outline:none;
  padding:14px 16px;
  border:1px solid #ffffff25;
  border-radius:15px;
  color:white;
  background:#ffffff08;
  font-family:Arial,sans-serif;
  font-size:14px;
}

textarea:focus{
  border-color:#00ffff;
  box-shadow:0 0 15px #00ffff33;
}

button{
  min-width:90px;
  height:48px;
  border:0;
  border-radius:15px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(
    135deg,#0066ff,#8b00ff,#ff00cc,#00ffff
  );
  background-size:300%;
  animation:buttonRGB 5s linear infinite;
  transition:.25s;
}

button:hover{
  transform:translateY(-3px);
  box-shadow:0 0 20px #00ffff77;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

@keyframes buttonRGB{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.clear-row{
  display:flex;
  justify-content:flex-end;
  margin-top:10px;
}

.clear-btn{
  min-width:auto;
  height:auto;
  padding:7px 12px;
  font-size:11px;
  color:#ff7799;
  background:#ff005511;
  border:1px solid #ff005566;
  animation:none;
}

.powered{
  text-align:center;
  margin-top:12px;
  color:#888899;
  font-size:12px;
  letter-spacing:1px;
}

.powered span{
  color:#00ffff;
  font-weight:bold;
  text-shadow:0 0 10px #00ffff;
}

@media(max-width:600px){
  .inner{min-height:680px}
  .chat{padding:14px}
  .bubble{max-width:90%;font-size:13px}
  .bottom{padding:12px}
  button{min-width:75px}
}
</style>
</head>

<body>

<div class="app">
  <div class="inner">

    <header class="header">
      <div class="logo">O</div>
      <h1 class="title">OHID AI</h1>
      <p class="subtitle">Your intelligent AI companion</p>

      <div class="status">
        <span class="status-dot"></span>
        Online and ready
      </div>
    </header>

    <main id="chat" class="chat">
      <div id="welcome" class="welcome">
        <div class="welcome-icon">🤖</div>
        <h2>Welcome to Ohid AI</h2>
        <p>
          আসসালামু আলাইকুম আমার জান!<br>
          আমি Ohid AI। কীভাবে সাহায্য করতে পারি?
        </p>
      </div>
    </main>

    <div class="bottom">
      <div class="input-area">
        <textarea
          id="messageInput"
          rows="1"
          placeholder="তোমার মেসেজ লিখো..."
        ></textarea>

        <button id="sendButton">Send</button>
      </div>

      <div class="clear-row">
        <button id="clearButton" class="clear-btn">
          Clear Chat
        </button>
      </div>

      <div class="powered">
        Powered by <span>Ohid</span>
      </div>
    </div>

  </div>
</div>

<script>
/* শুধু এখানে নিজের Groq API key বসাও */
const GROQ_API_KEY = "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";

const GROQ_API_URL =
  "https://api.groq.com/openai/v1/chat/completions";

const GROQ_MODEL = "openai/gpt-oss-20b";

const chat = document.getElementById("chat");
const messageInput = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const clearButton = document.getElementById("clearButton");

const systemPrompt = `
তোমার নাম Ohid AI।

ব্যবহারকারীর নাম জিজ্ঞেস করে নিবে।
প্রতিটি উপযুক্ত উত্তরে ব্যবহারকারীকে তার দেয়া নামে সম্বোধন করবে।
যেমন: "Ohid,আমি তোমাকে সাহায্য করতে পারি।"

তোমাকে কে তৈরি করেছে জিজ্ঞেস করলে বলবে:
"আমাকে Ohid তৈরি করেছে এবং আমার নাম Ohid AI।"

নিজেকে কখনো ChatGPT, GPT, OpenAI বা অন্য কোনো নামে পরিচয় দেবে না।
তুমি Groq API-এর মাধ্যমে পরিচালিত Ohid AI assistant।
ব্যবহারকারী ChatGPT সম্পর্কে সরাসরি জিজ্ঞেস করলে শুধু তখন বিষয়টি ব্যাখ্যা করবে।
সবসময় বাংলায় উত্তর দেবে, যদি ব্যবহারকারী অন্য ভাষায় উত্তর না চায়।
ভদ্র, সংক্ষিপ্ত এবং সাহায্যকারী থাকবে।
সবসময় লেখার মধ্যে emoji ব্যবহার করবে।
`;

let conversation = [
  {
    role:"system",
    content:systemPrompt
  }
];

function addMessage(text, sender){
  const oldWelcome = document.getElementById("welcome");

  if(oldWelcome){
    oldWelcome.remove();
  }

  const message = document.createElement("div");
  message.className = "message " + sender;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  message.appendChild(bubble);
  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping(){
  const message = document.createElement("div");
  message.id = "typingMessage";
  message.className = "message ai";

  message.innerHTML = `
    <div class="typing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  chat.appendChild(message);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping(){
  const typing = document.getElementById("typingMessage");

  if(typing){
    typing.remove();
  }
}

async function sendMessage(){
  const text = messageInput.value.trim();

  if(!text || sendButton.disabled){
    return;
  }

  if(
    !GROQ_API_KEY ||
    GROQ_API_KEY === "YOUR_GROQ_API_KEY_HERE"
  ){
    addMessage(
      "Ohid, আগে GROQ_API_KEY অংশে তোমার API key বসাও।",
      "ai"
    );
    return;
  }

  addMessage(text,"user");

  conversation.push({
    role:"user",
    content:text
  });

  messageInput.value = "";
  messageInput.style.height = "48px";

  sendButton.disabled = true;
  sendButton.textContent = "Wait...";

  addTyping();

  try{
    const response = await fetch(GROQ_API_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer " + GROQ_API_KEY
      },
      body:JSON.stringify({
        model:GROQ_MODEL,
        messages:conversation,
        temperature:.7,
        max_tokens:1024
      })
    });

    const data = await response.json();

    removeTyping();

    if(!response.ok){
      throw new Error(
        data.error?.message || "API request failed"
      );
    }

    const reply =
      data.choices?.[0]?.message?.content ||
      "দুঃখিত Baby, কোনো উত্তর পাওয়া যায়নি।";

    conversation.push({
      role:"assistant",
      content:reply
    });

    addMessage(reply,"ai");

  }catch(error){
    removeTyping();

    addMessage(
      "Ohid, API Error: " + error.message,
      "ai"
    );

  }finally{
    sendButton.disabled = false;
    sendButton.textContent = "Send";
    messageInput.focus();
  }
}

function clearChat(){
  conversation = [
    {
      role:"system",
      content:systemPrompt
    }
  ];

  chat.innerHTML = `
    <div id="welcome" class="welcome">
      <div class="welcome-icon">🤖</div>
      <h2>Welcome to Ohid AI</h2>
      <p>
        আসসালামু আলাইকুম Ohid!<br>
        আমি Ohid AI। কীভাবে সাহায্য করতে পারি?
      </p>
    </div>
  `;
}

messageInput.addEventListener("input",function(){
  this.style.height = "48px";
  this.style.height =
    Math.min(this.scrollHeight,130) + "px";
});

messageInput.addEventListener("keydown",function(event){
  if(event.key === "Enter" && !event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
});

sendButton.addEventListener("click",sendMessage);
clearButton.addEventListener("click",clearChat);
</script>

</body>
</html>
